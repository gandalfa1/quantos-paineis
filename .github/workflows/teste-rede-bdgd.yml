# TESTE (fase 4, rede por cidade, 10/11/2026) - so roda neste ramo, nunca no main.
# Baixa a BDGD 2025 (dados de 31/12/2025) da Energisa MT, publicada pela ANEEL
# no ArcGIS Online, e conta as unidades consumidoras por municipio pela tensao
# do transformador. Nao grava nada: o resultado fica no registro da execucao.

name: Teste rede BDGD

on:
  push:
    branches: [fase4-rede-teste-bdgd]

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: python -m pip install --quiet pyogrio pandas

      - name: Baixar a BDGD da Energisa MT (2025-12-31)
        run: |
          id=02a120db1b5149709f8d371c21635adc
          curl -sS -L --fail -m 2400 -o "$RUNNER_TEMP/bdgd.zip" -w "HTTP %{http_code}, %{size_download} bytes\n" \
            "https://www.arcgis.com/sharing/rest/content/items/$id/data"
          sha256sum "$RUNNER_TEMP/bdgd.zip"
          unzip -o -q "$RUNNER_TEMP/bdgd.zip" -d "$RUNNER_TEMP/bdgd"
          rm "$RUNNER_TEMP/bdgd.zip"
          find "$RUNNER_TEMP/bdgd" -maxdepth 3 -name "*.gdb" -type d
          df -h "$RUNNER_TEMP" | tail -1

      - name: Contar por municipio
        run: |
          gdb=$(find "$RUNNER_TEMP/bdgd" -maxdepth 3 -name "*.gdb" -type d | head -1)
          python teste/rede_bdgd_teste.py "$gdb" EMT
