# TESTE (fase 4, rede por cidade, 11/11/2026) - so roda neste ramo, nunca no main.
# Baixa a BDGD 2025 (dados de 31/12/2025) de TODAS as distribuidoras, publicada
# pela ANEEL no ArcGIS Online (dono aneel_aneel), uma por tarefa, e conta as
# unidades consumidoras por municipio pela tensao do transformador.
# Nao grava nada: o resultado de cada distribuidora fica no registro da execucao.

name: Teste rede BDGD

on:
  push:
    branches: [fase4-rede-teste-bdgd]
    paths: [teste/rede_bdgd_teste.py]

permissions:
  contents: read

jobs:
  lista:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      itens: ${{ steps.busca.outputs.itens }}
    steps:
      - name: Buscar os arquivos da BDGD 2025-12-31
        id: busca
        run: |
          curl -sS -L --fail -m 120 -o busca.json \
            "https://www.arcgis.com/sharing/rest/search?q=BDGD%202025-12-31%20owner%3Aaneel_aneel&num=100&sortField=title&f=json"
          python3 - <<'EOF'
          import json, os
          d = json.load(open("busca.json"))
          print("total na busca:", d.get("total"), "| nextStart:", d.get("nextStart"))
          itens = [r for r in d["results"]
                   if r.get("owner") == "aneel_aneel" and "2025-12-31" in r.get("title", "")
                   and r.get("type") == "File Geodatabase"]
          for r in itens:
              print(f"ITEM {r['id']} | {r['title']} | {r.get('size')} bytes")
          print("itens usados:", len(itens))
          saida = [{"id": r["id"], "rotulo": r["title"].split("_2025")[0]} for r in itens]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("itens=" + json.dumps(saida) + "\n")
          EOF

  contar:
    needs: lista
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        item: ${{ fromJson(needs.lista.outputs.itens) }}
    name: ${{ matrix.item.rotulo }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h "$RUNNER_TEMP" | tail -1

      - name: Instalar bibliotecas
        run: python -m pip install --quiet pyogrio pandas pyarrow geopandas

      - name: Baixar a BDGD
        run: |
          curl -sS -L --fail --retry 3 --retry-delay 20 -m 5400 -o "$RUNNER_TEMP/bdgd.zip" \
            -w "HTTP %{http_code}, %{size_download} bytes\n" \
            "https://www.arcgis.com/sharing/rest/content/items/${{ matrix.item.id }}/data"
          sha256sum "$RUNNER_TEMP/bdgd.zip"
          unzip -o -q "$RUNNER_TEMP/bdgd.zip" -d "$RUNNER_TEMP/bdgd"
          rm "$RUNNER_TEMP/bdgd.zip"
          find "$RUNNER_TEMP/bdgd" -maxdepth 3 -name "*.gdb" -type d
          df -h "$RUNNER_TEMP" | tail -1

      - name: Contar por municipio
        run: |
          gdb=$(find "$RUNNER_TEMP/bdgd" -maxdepth 3 -name "*.gdb" -type d | head -1)
          python teste/rede_bdgd_teste.py "$gdb" "${{ matrix.item.rotulo }}"
