# B1 (fase 4) - TESTE 4: coordenadas dos municipios no Wikidata (3a fonte, para
# desempatar IBGE x lista kelvins). Criado em 05/11/2026. TEMPORARIO: nao grava
# nada no repositorio e nao vai para o main.
#
# O Wikidata e CC0 (dominio publico): as coordenadas podem aparecer no registro.
# Busca todo item com codigo de municipio do IBGE (P1585) e coordenada (P625),
# fora as declaracoes "deprecated", e entrega o resultado compactado no registro
# (a nuvem do Claude nao alcanca o Wikidata nem baixa artefatos).
# Roda sozinho quando o ramo fase4-b1-teste-acesso recebe um envio.

name: B1 teste de acesso (NASA e IBGE)

on:
  push:
    branches: [fase4-b1-teste-acesso]

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wikidata - coordenadas dos municipios
        run: |
          cat > consulta.rq <<'EOF'
          SELECT ?item ?ibge ?coord ?rank ?tipo WHERE {
            ?item wdt:P1585 ?ibge ;
                  p:P625 ?st .
            ?st ps:P625 ?coord ;
                wikibase:rank ?rank .
            FILTER(?rank != wikibase:DeprecatedRank)
            OPTIONAL { ?item wdt:P31 ?tipo . }
          }
          EOF
          curl -sS -m 300 -G "https://query.wikidata.org/sparql" \
            --data-urlencode "query@consulta.rq" \
            -H "Accept: text/csv" \
            -H "User-Agent: quantos-paineis/1.1 (+https://quantospaineis.com.br/contato)" \
            -o wikidata.csv -w "HTTP %{http_code}, %{size_download} bytes\n"
          wc -l wikidata.csv
          head -3 wikidata.csv
          date -u +"consultado em %Y-%m-%dT%H:%M:%SZ"
          sha256sum wikidata.csv
          echo "=====INICIO_WIKIDATA====="
          gzip -9c wikidata.csv | base64 -w 200
          echo "=====FIM_WIKIDATA====="
