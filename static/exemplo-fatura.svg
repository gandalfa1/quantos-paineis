    <rect x="98"  y="618" width="2" height="24"/>
    <rect x="103" y="618" width="3" height="24"/>
    <rect x="110" y="618" width="5" height="24"/>
    <rect x="118" y="618" width="2" height="24"/>
    <rect x="123" y="618" width="3" height="24"/>
    <rect x="130" y="618" width="2" height="24"/>
    <rect x="135" y="618" width="4" height="24"/>
    <rect x="142" y="618" width="2" height="24"/>
    <rect x="147" y="618" width="3" height="24"/>
    <rect x="154" y="618" width="2" height="24"/>
    <rect x="159" y="618" width="5" height="24"/>
