<svg viewBox="0 0 700 660" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Exemplo ilustrativo de fatura de energia elétrica, destacando o valor total a pagar, o consumo do mês, o histórico de consumo mensal, o tipo de ligação da casa e a linha da contribuição de iluminação pública" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="barraGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC24B"/>
      <stop offset="100%" stop-color="#F2600C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="700" height="660" fill="#FAF7F2"/>
  <rect x="14" y="14" width="672" height="632" rx="16" fill="#FFFFFF" stroke="#F0DFC8" stroke-width="2"/>

  <!-- cabeçalho: logo placeholder + titulo -->
  <rect x="38" y="34" width="86" height="36" rx="8" fill="#EFE8DC"/>
  <text x="81" y="57" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6E655C" text-anchor="middle">[LOGO]</text>

  <text x="140" y="52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2B2620">CONTA DE ENERGIA ELÉTRICA</text>
  <text x="140" y="69" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6E655C">[Nome da distribuidora]</text>

  <text x="662" y="46" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6E655C" text-anchor="end">Nº do cliente: 000.000.000</text>
  <text x="662" y="62" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6E655C" text-anchor="end">Nº da instalação: 000.000.000</text>

  <line x1="38" y1="88" x2="662" y2="88" stroke="#F0DFC8" stroke-width="2"/>

  <!-- endereco placeholder (esquerda) -->
  <rect x="38" y="104" width="230" height="10" rx="5" fill="#EFE8DC"/>
  <rect x="38" y="124" width="260" height="10" rx="5" fill="#EFE8DC"/>
  <rect x="38" y="144" width="180" height="10" rx="5" fill="#EFE8DC"/>

  <!-- caixa tipo de ligacao (esquerda) + callout 4 -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="38" y="160" width="230" height="52" rx="8" fill="#FFFDFB" stroke="#F2600C" stroke-width="2.5"/>
    <text x="52" y="180" font-size="9.5" letter-spacing="0.5" fill="#6E655C">TIPO DE LIGAÇÃO</text>
    <text x="52" y="200" font-size="14" font-weight="700" fill="#2B2620">BIFÁSICA</text>
  </g>
  <circle cx="261" cy="160" r="18" fill="#F2600C"/>
  <text x="261" y="166" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- caixa total a pagar (direita) -->
  <rect x="416" y="102" width="246" height="98" rx="12" fill="#FFF6E6" stroke="#F2600C" stroke-width="2.5"/>
  <text x="438" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6E655C">Vencimento: 10/04/2026</text>
  <text x="438" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#6E655C">TOTAL A PAGAR</text>
  <text x="438" y="181" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#C94E0A">R$ 262,50</text>

  <!-- callout 1 -->
  <circle cx="655" cy="102" r="18" fill="#F2600C"/>
  <text x="655" y="108" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>

  <line x1="38" y1="220" x2="662" y2="220" stroke="#F0DFC8" stroke-width="2"/>

  <!-- faixa de 4 mini-caixas de leitura -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="38"  y="238" width="146" height="56" rx="8" fill="#FFFDFB" stroke="#F0DFC8" stroke-width="1.5"/>
    <rect x="196" y="238" width="146" height="56" rx="8" fill="#FFFDFB" stroke="#F0DFC8" stroke-width="1.5"/>
    <rect x="354" y="238" width="146" height="56" rx="8" fill="#FFFDFB" stroke="#F0DFC8" stroke-width="1.5"/>
    <rect x="512" y="238" width="150" height="56" rx="8" fill="#FFFDFB" stroke="#F0DFC8" stroke-width="1.5"/>

    <text x="52"  y="258" font-size="9.5" letter-spacing="0.5" fill="#6E655C">LEITURA ANTERIOR</text>
    <text x="52"  y="278" font-size="14" font-weight="700" fill="#2B2620">12/02/2026</text>

    <text x="210" y="258" font-size="9.5" letter-spacing="0.5" fill="#6E655C">LEITURA ATUAL</text>
    <text x="210" y="278" font-size="14" font-weight="700" fill="#2B2620">13/03/2026</text>

    <text x="368" y="258" font-size="9.5" letter-spacing="0.5" fill="#6E655C">DIAS CONSIDERADOS</text>
    <text x="368" y="278" font-size="14" font-weight="700" fill="#2B2620">29 dias</text>

    <text x="526" y="258" font-size="9.5" letter-spacing="0.5" fill="#6E655C">CONSUMO DO MÊS</text>
    <text x="526" y="278" font-size="14" font-weight="700" fill="#2B2620">350 kWh</text>
  </g>

  <!-- destaque da caixa "consumo do mes" + callout 2 -->
  <rect x="512" y="238" width="150" height="56" rx="8" fill="none" stroke="#F2600C" stroke-width="2.5"/>
  <circle cx="655" cy="238" r="18" fill="#F2600C"/>
  <text x="655" y="244" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>

  <line x1="38" y1="316" x2="662" y2="316" stroke="#F0DFC8" stroke-width="2"/>

  <!-- historico de consumo -->
  <text x="38" y="336" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2B2620">Histórico de consumo (kWh)</text>

  <!-- callout 3 -->
  <circle cx="332" cy="330" r="18" fill="#F2600C"/>
  <text x="332" y="336" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- linha de media -->
