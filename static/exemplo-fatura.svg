  <text x="44" y="374" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-style="italic" fill="#8A7E6E">média do período</text>

  <!-- eixo -->
  <line x1="38" y1="470" x2="662" y2="470" stroke="#D8CBB4" stroke-width="2"/>

  <!-- 12 barras, ultima (mes atual) em destaque -->
  <!-- Alturas reduzidas em 11,4% (14/09/2026): a barra mais alta subia ate
       y=330 e invadia o titulo "Historico de consumo (kWh)", que ocupa de
       y=322 a y=340 e vai ate x=241 em Arial 15px. Agora o topo mais alto
       para em y=346. A linha de media acompanhou, de y=371 para y=383. -->
  <g>
    <rect x="44"  y="390" width="32" height="80"  rx="4" fill="url(#barraGrad)" opacity="0.85"/>
    <rect x="96"  y="380" width="32" height="90"  rx="4" fill="url(#barraGrad)" opacity="0.85"/>
    <rect x="148" y="364" width="32" height="106" rx="4" fill="url(#barraGrad)" opacity="0.85"/>
    <rect x="200" y="346" width="32" height="124" rx="4" fill="url(#barraGrad)" opacity="0.85"/>
    <rect x="252" y="364" width="32" height="106" rx="4" fill="url(#barraGrad)" opacity="0.85"/>
    <rect x="304" y="381" width="32" height="89"  rx="4" fill="url(#barraGrad)" opacity="0.85"/>
    <rect x="356" y="396" width="32" height="74"  rx="4" fill="url(#barraGrad)" opacity="0.85"/>
    <rect x="408" y="404" width="32" height="66"  rx="4" fill="url(#barraGrad)" opacity="0.85"/>
    <rect x="460" y="413" width="32" height="57"  rx="4" fill="url(#barraGrad)" opacity="0.85"/>
    <rect x="512" y="399" width="32" height="71"  rx="4" fill="url(#barraGrad)" opacity="0.85"/>
    <rect x="564" y="383" width="32" height="87"  rx="4" fill="url(#barraGrad)" opacity="0.85"/>
    <rect x="616" y="373" width="32" height="97"  rx="4" fill="#C94E0A"/>
    <text x="632" y="365" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#C94E0A" text-anchor="middle">350</text>
  </g>

  <!-- meses -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6E655C" text-anchor="middle">
    <text x="60"  y="484">J</text>
    <text x="112" y="484">F</text>
    <text x="164" y="484">M</text>
    <text x="216" y="484">A</text>
    <text x="268" y="484">M</text>
    <text x="320" y="484">J</text>
    <text x="372" y="484">J</text>
    <text x="424" y="484">A</text>
    <text x="476" y="484">S</text>
    <text x="528" y="484">O</text>
    <text x="580" y="484">N</text>
    <text x="632" y="484" font-weight="700" fill="#C94E0A">D</text>
  </g>
  <text x="632" y="498" font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#C94E0A" text-anchor="middle">(mês atual)</text>

  <line x1="38" y1="512" x2="662" y2="512" stroke="#F0DFC8" stroke-width="2"/>

  <!-- MELHORIAS DO SITE (03/10/2026), ITEM 36 DO BACKLOG - o (5): cobrancas que
       nao sao energia. A linha da iluminacao publica fica no grupo "Outros
       Tributos, Produtos e Servicos" e a descricao termina em "municipal" ou
       "distrital" (PRODIST, Modulo 11, item 30.1, e o modelo de fatura do mesmo
       modulo). A imagem cresceu 80 de altura (580 -> 660); o bloco "Pagamento"
       desceu 80. Valor ilustrativo. -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="534" font-size="9.5" letter-spacing="0.5" fill="#6E655C">OUTROS TRIBUTOS, PRODUTOS E SERVIÇOS</text>
    <rect x="38" y="544" width="624" height="34" rx="8" fill="#FFFDFB" stroke="#F2600C" stroke-width="2.5"/>
    <text x="52" y="566" font-size="12.5" font-weight="700" fill="#2B2620">CONTRIB. ILUM. PÚBLICA MUNICIPAL</text>
    <text x="600" y="566" font-size="12.5" font-weight="700" fill="#2B2620" text-anchor="end">R$ 18,50</text>
  </g>
  <circle cx="655" cy="544" r="18" fill="#F2600C"/>
  <text x="655" y="550" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>

  <line x1="38" y1="592" x2="662" y2="592" stroke="#F0DFC8" stroke-width="2"/>

  <!-- codigo de barras (linha digitavel do boleto) -->
  <text x="38" y="610" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#8A7E6E">Pagamento</text>
  <g fill="#2B2620">
    <rect x="38"  y="618" width="2" height="24"/>
    <rect x="43"  y="618" width="4" height="24"/>
    <rect x="50"  y="618" width="2" height="24"/>
    <rect x="55"  y="618" width="3" height="24"/>
